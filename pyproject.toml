[project]
name = "git-recommit"
version = "0.1.0"
description = "Rebuild a run of commits into reviewable ones, in a TUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Harper", email = "benekastah@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    # v0.0.2, by its commit, which unlike the tag can't be moved.
    "py-git-client @ git+https://github.com/benekastah/py-git-client@a1b4b0f15ae740c17db2d5fca4684aeaae6a8d54",
    "textual>=8.2.8",
]

[project.scripts]
git-recommit = "git_recommit.cli:main"

[dependency-groups]
# The template's dev tools, kept current by `copier update`; the project's own go in `dev`
# (`uv add --dev`), so the two never conflict.
template-dev = [
    "basedpyright>=1.40.2",
    "coverage>=7.17.3",
    # pandoc, for dev.py man. Pinned: `man --check` compares its exact output with the pages.
    # It has no wheel for Windows on ARM, so dev.py venv fails there.
    "pypandoc_binary==1.17",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]
dev = [{ include-group = "template-dev" }]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

# For py-git-client, which isn't on PyPI: a git URL in `dependencies`, which pip (and so pipx)
# reads too, unlike `[tool.uv.sources]`.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["git_recommit"]

[tool.pytest]
testpaths = ["tests"]
# One worker per CPU (pytest-xdist); `-n 0` runs them one at a time, e.g. to debug.
addopts = ["--numprocesses", "auto"]

[tool.ruff]
line-length = 120
# Even when a hook names it: dev.py is python-template's, formatted to its 100 columns.
force-exclude = true
target-version = "py315"
# dev.py runs under an older Python too, to say it's too old: keep it to syntax that parses there.
# So does what dev_project.py imports (it's loaded before .venv exists): the package's init, and
# the modules skills.py needs.
per-file-target-version = { "dev.py" = "py311", "dev_project.py" = "py311", "git_recommit/__init__.py" = "py311", "git_recommit/errors.py" = "py311", "git_recommit/skills.py" = "py311" }

[tool.ruff.format]
exclude = ["dev.py"]

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    # The project's own below:
    "C901",
    "PERF401",
    # Every function annotated, which basedpyright infers rather than requires.
    "ANN",
]
# An explicit Any (ANN401) is allowed.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# dev.py is python-template's, checked there with the template's rules only: not
# this project's additions, which a template update could break.
"dev.py" = ["C901", "PERF401", "ANN"]

[tool.basedpyright]
include = [
    "git_recommit",
    "tests",
    "dev.py",
    # The project's own below:
    "dev_project.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.15"
# Linux, so it says the same on every system; `dev.py types-windows` checks as if on Windows.
pythonPlatform = "Linux"
# A variable whose type is unknown is an error (e.g. a list made empty needs its
# item type), as mypy's strict mode inferred or required it. Using an unknown
# value isn't: Textual's `App.app`, parsed JSON, a bare `set()` argument or a
# test's lambda: mypy's strict mode treats those as Any, and doesn't check
# their use either.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false

[tool.coverage.run]
source = ["git_recommit"]
branch = true
# Measure each pytest-xdist worker, a process of its own, in a data file of its own, which
# `dev.py coverage` combines.
parallel = true
patch = ["subprocess"]
# pytest-xdist's main process runs no tests, so it measures nothing: not worth a warning.
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
show_missing = true
skip_covered = true
