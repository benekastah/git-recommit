[package]
name = "git-recommit"
version = "0.1.0"
description = "An application to transform one set of commits to a more organized set of commits"
authors = ["Paul Harper <benekastah@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
