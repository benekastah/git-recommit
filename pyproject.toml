[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "git-recommit"
version = "0.1.0"
description = "Rebuild a run of commits into reviewable ones, in a TUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8"]

[dependency-groups]
dev = ["basedpyright>=1.40.2", "pytest>=9.2.0", "pytest-xdist>=3.8.0", "ruff>=0.17.5", "shellcheck-py>=0.11.0.1"]

[project.scripts]
git-recommit = "git_recommit.cli:main"

[tool.setuptools.packages.find]
include = ["git_recommit*"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-n", "auto"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM", "C901", "PERF401"]

[tool.basedpyright]
include = ["git_recommit", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# Linux, so it says the same on every system; lint.sh checks as if on Windows too.
pythonPlatform = "Linux"
# Strict, but for values whose type is only inferred as unknown (e.g. an
# empty list's items).
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
