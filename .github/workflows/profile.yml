name: Profile

on:
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    steps:
      - name: Turn off Defender's real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          activate-environment: true
      - run: uv pip install --group dev --editable .
      - name: Git processes on C (the default temp directory), timed
        shell: bash
        run: |
          echo "TEMP=$TEMP"
          mkdir trace-c
          GIT_TRACE2_EVENT="$PWD/trace-c" python -m pytest -q -n 0 -p no:randomly tests/test_old_commits.py
          python .github/workflows/git_times.py trace-c
      - name: Git processes on D, timed
        shell: bash
        run: |
          mkdir -p /d/tmp trace-d
          GIT_TRACE2_EVENT="$PWD/trace-d" python -m pytest -q -n 0 -p no:randomly --basetemp=D:/tmp/pytest tests/test_old_commits.py
          python .github/workflows/git_times.py trace-d
      - name: Whole suite on D
        run: python -m pytest -q -p no:randomly --basetemp=D:/tmp/pytest-all
      - name: Whole suite on C
        run: python -m pytest -q -p no:randomly
