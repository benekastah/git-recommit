name: Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Whether GitHub honors a fractional timeout-minutes: 0.2 minutes is 12s,
  # so a job that sleeps 50s is cancelled at about 12s if it does, at 60s
  # if it rounds up, and not at all if it ignores it.
  fractional-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 0.2
    steps:
      - run: sleep 50
