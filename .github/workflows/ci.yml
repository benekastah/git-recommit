name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push cancels the branch's run still going, which no longer says
# anything about the branch and holds runners the new one needs (an account
# runs only so many jobs at once). On main too: merging a stack pushes several
# commits at once, and only the newest one's run matters, since each pull
# request had to pass before it merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job's time limit (timeout-minutes) is about 20% over the longest it
# has taken, rounded up to whole minutes (GitHub doesn't honor fractions), so
# a hung job fails soon. If a job runs into it, speed the job up if
# possible, and only then raise the limit (see AGENTS.md).
jobs:
  # Linting and type checking give the same answer everywhere (basedpyright
  # checks for Windows too, and for the oldest Python pyproject.toml allows),
  # so they run once.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # 24s.
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          # The venv's Python (setup-python's), named so uv can't choose another.
          python-version: "3.11"
      - name: Install the dev dependencies
        run: uv sync --locked
      - name: Lint
        run: ./lint.sh

  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest Python pyproject.toml allows, and the newest.
        python: ["3.11", "3.15"]
        # Each OS's time limit, in minutes (from 55s, 2m39s and 3m35s).
        include:
          - os: ubuntu-latest
            timeout: 2
          - os: macos-latest
            timeout: 4
          - os: windows-latest
            timeout: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install the dev dependencies
        run: uv sync --locked
      - name: Run the tests
        run: python -m pytest

  # The one check the ruleset on main requires, so changing the jobs doesn't
  # change what's required. It runs even if a check failed (a skipped required
  # check would count as passing), and fails unless every check passed.
  passed:
    name: CI passed
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    # 4s.
    timeout-minutes: 1
    steps:
      - name: Fail unless every check passed
        if: needs.lint.result != 'success' || needs.test.result != 'success'
        run: exit 1
